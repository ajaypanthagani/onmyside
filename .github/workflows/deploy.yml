name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Verify secrets are configured
        run: |
          echo "Checking if secrets are set..."
          if [ "${{ secrets.NEXT_PUBLIC_GOOGLE_API_KEY }}" == "" ]; then
            echo "::error::NEXT_PUBLIC_GOOGLE_API_KEY secret is not set"
            echo "Please add this secret in: Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ "${{ secrets.NEXT_PUBLIC_GOOGLE_SEARCH_ENGINE_ID }}" == "" ]; then
            echo "::error::NEXT_PUBLIC_GOOGLE_SEARCH_ENGINE_ID secret is not set"
            echo "Please add this secret in: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✓ Both secrets are configured"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_API_KEY }}
          NEXT_PUBLIC_GOOGLE_SEARCH_ENGINE_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_SEARCH_ENGINE_ID }}
          # Set repository name for subdirectory deployment
          GITHUB_REPOSITORY_NAME: onmyside

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

